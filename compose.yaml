# One command to start Pegal with its MySQL database: docker compose up --build
# Then open http://localhost:8000 and sign in with a demo user from the README.
# Data lives in the "pegal-db" volume, so it survives a restart. "docker compose down -v" wipes it.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pegal
      MYSQL_ROOT_PASSWORD: pegal-demo-root   # demo only, the port is not published to the host
    volumes:
      - pegal-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppegal-demo-root"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pegal
      DB_USERNAME: root
      DB_PASSWORD: pegal-demo-root
    ports:
      - "8000:8000"

volumes:
  pegal-db:
